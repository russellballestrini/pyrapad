[app:main]
use = egg:pyrapad

# Pyramid Configuration
pyramid.reload_templates = true
pyramid.reload_assets = true
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.default_locale_name = en
pyramid.includes =
    pyramid_debugtoolbar
    pyramid_tm

# Database Configuration
sqlalchemy.url = sqlite:///%(here)s/pyrapad.db
# SQLite performance optimizations
sqlalchemy.echo = false
sqlalchemy.pool_recycle = 3600

# Template Configuration
mako.directories = pyrapad:templates
mako.strict_undefined = true

# Application Settings
#google_analytics_key = UA-55555555-1
google_analytics_key =

# Storage Backend (database, filesystem, s3, pypi_vault)
storage.backend = database
# Filesystem backend settings
#storage.filesystem.path = %(here)s/pads
# S3 backend settings
#storage.s3.bucket = pyrapad-storage
#storage.s3.region = us-east-1
# PyPI Vault backend settings
#storage.pypi_vault.url = https://pypi.example.com

# Code Sandbox Settings
sandbox.enabled = true
sandbox.timeout = 5
sandbox.memory_limit = 128m
sandbox.cpu_limit = 1

[server:main]
use = egg:waitress#main
host = 0.0.0.0
port = 6543

# Begin logging configuration

[loggers]
keys = root, pyrapad, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_pyrapad]
level = DEBUG
handlers =
qualname = pyrapad

[logger_sqlalchemy]
level = INFO
handlers =
qualname = sqlalchemy.engine
# "level = INFO" logs SQL queries.
# "level = DEBUG" logs SQL queries and results.
# "level = WARN" logs neither.  (Recommended for production systems.)

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s][%(threadName)s] %(message)s

# End logging configuration
